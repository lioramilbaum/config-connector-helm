apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: config-connector
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: config-connector-helm
  interval: 10m
  install:
    crds: Create
    createNamespace: true
  upgrade:
    crds: CreateReplace
  targetNamespace: configconnector-operator-system
