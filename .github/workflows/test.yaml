name: Test

on:
  workflow_call:
    inputs:
      kcc-version:
        required: true
        type: string

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: jdx/mise-action@249c01ba271e19fa76eede7f766161cc95ace489  # v2.1.10

      - name: Fetch manifest
        run: scripts/fetch-manifest.sh ${{ inputs.kcc-version }}

      - name: Helm lint
        run: helm lint chart/config-connector --namespace configconnector-operator-system

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Validate with kubeconform
        run: |
          helm template x chart/config-connector -n configconnector-operator-system > rendered.yaml
          if ! kubeconform -strict -summary -kubernetes-version 1.30.0 \
              -skip CustomResourceDefinition rendered.yaml > kubeconform.txt; then
            grep -v '^Summary' kubeconform.txt | head -20 | sed 's/^/::error title=kubeconform::/'
            cat kubeconform.txt
            exit 1
          fi
          cat kubeconform.txt

  e2e-helm:
    name: E2E with Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: jdx/mise-action@249c01ba271e19fa76eede7f766161cc95ace489  # v2.1.10

      - name: Create kind cluster
        run: |
          kind create cluster --name test --image kindest/node:v1.30.0

      - name: Fetch manifest
        run: scripts/fetch-manifest.sh ${{ inputs.kcc-version }}

      - name: Install chart
        run: |
          helm install config-connector chart/config-connector \
            -n configconnector-operator-system \
            --create-namespace \
            --wait \
            --timeout 5m

      - name: Wait for StatefulSet
        run: |
          kubectl rollout status statefulset \
            -n configconnector-operator-system \
            --timeout=5m

      - name: Verify CRDs installed
        run: |
          crds=$(kubectl get crd --selector app.kubernetes.io/name=config-connector -o name | wc -l)
          if [ "$crds" -lt 5 ]; then
            echo "Expected at least 5 CRDs, got $crds"
            exit 1
          fi

      - name: Uninstall chart
        run: helm uninstall config-connector -n configconnector-operator-system

      - name: Verify CRDs remain
        run: |
          crds=$(kubectl get crd --selector app.kubernetes.io/name=config-connector -o name | wc -l)
          if [ "$crds" -lt 5 ]; then
            echo "CRDs were removed on uninstall"
            exit 1
          fi

  e2e-flux:
    name: E2E with Flux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: jdx/mise-action@249c01ba271e19fa76eede7f766161cc95ace489  # v2.1.10

      - name: Create kind cluster
        run: |
          kind create cluster --name test --image kindest/node:v1.30.0

      - name: Fetch manifest
        run: scripts/fetch-manifest.sh ${{ inputs.kcc-version }}

      - name: Package chart
        run: helm package chart/config-connector --version ${{ inputs.kcc-version }} --app-version ${{ inputs.kcc-version }}

      - name: Start local registry
        run: |
          docker run -d -p 5000:5000 --name registry registry:2
          # Put the registry on kind's network so in-cluster Flux can reach it as registry:5000
          docker network connect kind registry
          sleep 2

      - name: Push chart to local registry
        run: |
          helm push config-connector-${{ inputs.kcc-version }}.tgz oci://localhost:5000 --plain-http

      - name: Install Flux
        run: flux install

      - name: Apply OCIRepository
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: source.toolkit.fluxcd.io/v1
          kind: OCIRepository
          metadata:
            name: config-connector-helm
            namespace: flux-system
          spec:
            interval: 10m
            url: oci://registry:5000/config-connector
            ref:
              tag: ${{ inputs.kcc-version }}
            insecure: true
          EOF

      - name: Apply HelmRelease
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: config-connector
            namespace: flux-system
          spec:
            chartRef:
              kind: OCIRepository
              name: config-connector-helm
            interval: 10m
            install:
              crds: Create
              createNamespace: true
            upgrade:
              crds: CreateReplace
            targetNamespace: configconnector-operator-system
          EOF

      - name: Wait for HelmRelease ready
        run: |
          kubectl wait --for=condition=ready helmrelease/config-connector \
            -n flux-system \
            --timeout=5m

      - name: Verify deployment
        run: |
          kubectl rollout status statefulset \
            -n configconnector-operator-system \
            --timeout=5m
