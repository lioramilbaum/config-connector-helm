[tools]
helm = "3.22.0"
cosign = "2.6.5"
crane = "0.22.1"
kind = "0.24.0"
kubectl = "1.31.3"
kubeconform = "0.8.0"
flux2 = "2.9.6"
uv = "0.4.30"
actionlint = "1.7.12"
shellcheck = "0.10.0"
ruff = "0.11.8"

[tasks.fetch]
run = "scripts/fetch-manifest.sh 1.158.0"

[tasks.test]
run = "uv run pytest tests/ -v"

[tasks.lint]
run = [
  "actionlint .github/workflows/*.yaml",
  "shellcheck scripts/*.sh",
  "ruff check scripts/ tests/",
]
