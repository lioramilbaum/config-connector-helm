[tools]
helm = "4.3.1"
cosign = "3.1.3"
crane = "0.22.1"
kind = "0.33.0"
kubectl = "1.37.1"
kubeconform = "0.8.0"
flux2 = "2.9.6"
uv = "0.13.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"
ruff = "0.17.1"

[tasks.fetch]
run = "scripts/fetch-manifest.sh"

[tasks.test]
run = "uv run pytest tests/ -v"

[tasks.lint]
run = [
  "actionlint .github/workflows/*.yaml",
  "shellcheck scripts/*.sh",
  "ruff check scripts/ tests/",
]
